name: Create Pre-Release

on:
  push:
    branches:
      - "master"

jobs:
  pre-release:
    permissions: write-all
    
    name: "Pre Release"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - name: Build distribution with Gradle
        run: ./gradlew distZip
        
      - name: Decompress distribution zip file
        uses: montudor/action-zip@v1
        with:
          args: unzip -qq Lisbon-Server/build/distributions/Lisbon-Server.zip -d ./release
          
      - name: File release preparation
        run: |
          sudo rm -rf ./release/Lisbon-Server/bin/*
          sudo rm -rf ./release/Lisbon-Server/bin
          sudo mkdir ./Lisbon
          sudo mkdir ./Lisbon/lib
          sudo mv ./release/Lisbon-Server/lib/Lisbon-Server.jar ./Lisbon/lisbon.jar
          sudo mv ./release/Lisbon-Server/lib/* ./Lisbon/lib
          sudo cp tools/scripts/run.bat ./Lisbon/
          sudo cp tools/scripts/run.sh ./Lisbon/

      - id: sha-short
        name: Get short SHA
        run: echo "::set-output name=sha-short::$(git rev-parse --short HEAD)"
        
      - name: Compress release files
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r ./Lisbon-${{ steps.sha-short.outputs.sha-short }}.zip ./Lisbon
          
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build ${{ steps.sha-short.outputs.sha-short }}"
          files: |
            Lisbon-${{ steps.sha-short.outputs.sha-short }}.zip