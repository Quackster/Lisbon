name: Create Pre-Release

on:
  push:
    branches:
      - "master"

jobs:
  pre-release:
    permissions: write-all
    
    name: "Pre Release"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - name: Build distribution with Gradle
        run: ./gradlew packageDist
          
      - name: File release preparation
        run: |
          rm -rf ./Lisbon
          mkdir ./Lisbon
          cp -R ./dist/. ./Lisbon/
          chmod +x ./Lisbon/start.sh

      - id: sha-short
        name: Get short SHA
        run: echo "sha-short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        
      - name: Compress release files
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r ./Lisbon-${{ steps.sha-short.outputs.sha-short }}.zip ./Lisbon
          
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build ${{ steps.sha-short.outputs.sha-short }}"
          files: |
            Lisbon-${{ steps.sha-short.outputs.sha-short }}.zip
